[project]
name = "speech-server"
version = "0.1.0"
description = "Local VAD + STT + TTS WebSocket workers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "numpy>=2.0",
    "onnxruntime-gpu>=1.20",
    "faster-whisper>=1.1",
    "kokoro-onnx>=0.4",
    "huggingface-hub>=0.26",
    "misaki>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speech_server"]

[tool.uv]
package = true
# kokoro-onnx pulls CPU onnxruntime; the 5080 must use the GPU package.
override-dependencies = [
    "onnxruntime; sys_platform == 'never'",
]
