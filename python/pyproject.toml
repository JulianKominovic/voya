[project]
name = "speech-server"
version = "0.1.0"
description = "Local VAD + STT + TTS WebSocket workers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "numpy>=2.0",
    "onnxruntime-gpu>=1.20",
    "nvidia-cuda-runtime>=13.0",
    "nvidia-cublas>=13.0",
    "nvidia-curand>=10.3",
    "nvidia-cudnn-cu13>=9.0",
    # CTranslate2 (faster-whisper) still links libcublas.so.12, not 13.
    "nvidia-cuda-runtime-cu12>=12.0",
    "nvidia-cublas-cu12>=12.0",
    "faster-whisper>=1.1",
    "kokoro-onnx>=0.4",
    "huggingface-hub>=0.26",
    "misaki>=0.4",
]

[project.optional-dependencies]
qwen = [
    "qwen-tts>=0.1.1",
    "faster-qwen3-tts>=0.3.2",
    "torch>=2.7",
    "torchaudio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speech_server"]

[tool.uv]
package = true
# kokoro-onnx / qwen-tts pull CPU onnxruntime; the 5080 must use the GPU package.
# qwen-tts pulls gradio for its demo CLI — unused. sox is imported at load; keep it.
# torch pulls nvidia-cudnn-cu12 into the same nvidia/cudnn/lib as cu13;
# uninstalling it deletes libcudnn and Silero/ORT die.
override-dependencies = [
    "onnxruntime; sys_platform == 'never'",
    "gradio; sys_platform == 'never'",
    "nvidia-cudnn-cu12; sys_platform == 'never'",
]

# CUDA wheels with sm_120 (Blackwell / 5080). Not the CPU package from PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }
torchaudio = { index = "pytorch-cu128", marker = "sys_platform == 'linux'" }
