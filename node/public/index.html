<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voya — Voice MVP</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1216;
        --panel: #171c22;
        --line: #2a323c;
        --text: #e8edf2;
        --muted: #8b97a4;
        --accent: #6ee7b7;
        --warn: #fbbf24;
        --err: #f87171;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.45 ui-sans-serif, system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      main {
        max-width: 1160px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
      p.lead { color: var(--muted); margin: 0 0 20px; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
      button {
        background: var(--accent);
        color: #042014;
        border: 0;
        border-radius: 8px;
        padding: 8px 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button.ghost {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--line);
      }
      button:disabled { opacity: 0.45; cursor: default; }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 10px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-size: 11px;
      }
      .pill.on { color: var(--accent); border-color: #245c48; }
      .pill.speech { color: var(--warn); border-color: #5c4a20; }
      .pill.think { color: #93c5fd; border-color: #1e3a5f; }
      .pill.err { color: var(--err); border-color: #5c2020; }
      label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
      textarea, input[type="text"] {
        width: 100%;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
        font: inherit;
      }
      .metrics {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
        margin: 16px 0;
      }
      .metric {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
      }
      .metric span { display: block; color: var(--muted); font-size: 11px; }
      .metric strong { font-size: 20px; font-variant-numeric: tabular-nums; }
      .out {
        min-height: 48px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
      }
      #question { color: var(--warn); min-height: 36px; }
      #log {
        height: 360px;
        overflow: auto;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--muted);
      }
      #log table { width: 100%; border-collapse: collapse; }
      #log th, #log td {
        text-align: left;
        padding: 3px 8px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      #log thead th {
        position: sticky;
        top: 0;
        background: var(--panel);
        color: var(--text);
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        z-index: 1;
      }
      #log td.time { white-space: nowrap; font-variant-numeric: tabular-nums; }
      #log td.evt {
        max-width: 280px;
        overflow-wrap: anywhere;
      }
      #log td.stt { color: var(--warn); }
      #log td.llm_conv { color: #93c5fd; }
      #log td.llm_agentic { color: #c4b5fd; }
      #log td.minions { color: var(--accent); }
      #log td.tts { color: #f9a8d4; }
    </style>
  </head>
  <body>
    <main>
      <h1>Voya — voice + LLM</h1>
      <p class="lead">Chrome + headphones. Mic always on (barge-in). Whisper → orchestrator → Kokoro.</p>
      <div class="row">
        <button id="talk" type="button">Speak</button>
        <button id="stop" class="ghost" type="button" disabled>Stop</button>
        <span id="state" class="pill">idle</span>
        <label><input id="echo" type="checkbox" /> echo TTS</label>
      </div>
      <div class="row">
        <textarea id="synth-text" rows="2" placeholder="Synthesize this…">Hello. This is a Kokoro test.</textarea>
      </div>
      <div class="row">
        <button id="synth" class="ghost" type="button">Synthesize</button>
        <button id="cancel" class="ghost" type="button">Cancelar</button>
      </div>
      <div class="metrics">
        <div class="metric"><span>speech_end → transcript</span><strong id="lat-stt">—</strong></div>
        <div class="metric"><span>transcript → first chunk</span><strong id="lat-llm">—</strong></div>
        <div class="metric"><span>speak → primer chunk</span><strong id="lat-tts">—</strong></div>
      </div>
      <div class="out" id="transcript">—</div>
      <div class="out" id="question" title="pending question">—</div>
      <div class="out" id="assistant">—</div>
      <div id="log">
        <table>
          <thead>
            <tr>
              <th>datetime</th>
              <th>STT</th>
              <th>LLM Conversacional</th>
              <th>LLM Agentico</th>
              <th>Minions</th>
              <th>TTS</th>
            </tr>
          </thead>
          <tbody id="log-body"></tbody>
        </table>
      </div>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
